<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Behavior Dashboard Module Demo</title>
  <link rel="stylesheet" href="./behavior-dashboard.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #06101f;
      padding: 24px;
      font-family: Inter, system-ui, sans-serif;
    }
    .page-shell {
      max-width: 1500px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div id="behaviorDashboardMount"></div>
  </div>

  <script src="./behavior-dashboard.js"></script>
  <script>
    window.behaviorDashboard = BehaviorBentoDashboard.mount("#behaviorDashboardMount", {
      title: "Classroom Signal Deck",
      subtitle: "Drop-in bento dashboard wrapper for localStorage-based behavior tracking."
    });
  </script>
</body>
</html>
